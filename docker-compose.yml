
services:
  postgres:
    image: postgres:16-alpine
    container_name: attendai_db
    restart: no
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: attendai
      POSTGRES_DB: attendai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
